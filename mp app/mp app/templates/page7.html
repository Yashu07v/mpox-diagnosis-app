{% extends 'base.html' %}

{% block title %}Functional Screening - Upload Files{% endblock %}

{% block content %}
<style>
  .upload-section {
    margin-bottom: 30px;
  }
  .upload-section label {
    font-weight: bold;
  }
  .upload-section input {
    margin-bottom: 10px;
  }
  .upload-section button {
    margin-left: 10px;
    background-color: #007bff;
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  .upload-section button:hover {
    background-color: #0056b3;
  }
  #result {
    margin-top: 30px;
  }
</style>

<div class="upload-section">
  <h3>Upload Ligand File (.sdf, .xlsx)</h3>
  <input type="file" id="ligandFile" accept=".sdf,.xlsx">
  <button onclick="uploadLigand()">Upload Ligand</button>
</div>

<div class="upload-section">
  <h3>Upload Protein File (.pdb, .mol2, .pdbqt)</h3>
  <input type="file" id="proteinFile" accept=".pdb,.mol2,.pdbqt">
  <button onclick="uploadProtein()">Upload Protein</button>
</div>

<div id="result"></div>

{% endblock %}

{% block scripts %}
<script>
  async function uploadLigand() {
        const ligandFile = document.getElementById('ligandFile').files[0];
        if (!ligandFile) {
            alert('Please upload the ligand file.');
            return;
        }

        const formData = new FormData();
        formData.append('ligandFile', ligandFile);

        try {
            const response = await fetch('/upload_ligand', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const result = await response.json();
                const csvUrl = result.ligand_smiles_csv_url || '';
                document.getElementById('result').innerHTML = `
                    <p><strong>Ligand SMILES CSV:</strong> <a href="${csvUrl}" target="_blank">Download</a></p>
                `;
            } else {
                const error = await response.text();
                alert('Ligand upload failed: ' + error);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred while uploading the ligand file.');
        }
    }

    async function uploadProtein() {
    const proteinFile = document.getElementById('proteinFile').files[0];
    if (!proteinFile) {
      alert('Please upload the protein file.');
      return;
    }

    const formData = new FormData();
    formData.append('proteinFile', proteinFile);

    try {
      const response = await fetch('/upload_protein', {
        method: 'POST',
        body: formData
      });

      if (response.ok) {
        // Show the fixed static image path
        document.getElementById('result').innerHTML = `
          <h3>Phylogenetic Tree:</h3>
          <img src="/static/images/phylogenetic_tree.png" width="300" style="border: 1px solid #ccc;" />
        `;
      } else {
        const error = await response.text();
        alert('Protein upload failed: ' + error);
      }
    } catch (error) {
      console.error('Error:', error);
      alert('An error occurred while uploading the protein file.');
    }
  }
</script>
{% endblock %}
